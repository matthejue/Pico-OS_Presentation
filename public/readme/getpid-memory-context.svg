<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" role="img"><style>text{font-family:Cantarell, sans-serif;fill:#17313a;font-size:21px} .label{fill:#167b84;font-weight:700;font-size:25px} .small{font-size:18px} .box{fill:#f4fafa;stroke:#078b98;stroke-width:2} .kernel{fill:#fff8e9;stroke:#c8861a;stroke-width:2} .arrow{fill:none;stroke:#078b98;stroke-width:3;marker-end:url(#tip)}</style><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#078b98"/></marker></defs><rect x="295" y="5" width="490" height="97" class="box"/><text x="313" y="40" class="label">One CPU · live registers</text><text x="313" y="77" class="">PC / CS / DS / SP / BAF · ACC / IN1 / IN2</text><rect x="5" y="140" width="1070" height="265" fill="white" stroke="#9bcdd2" stroke-width="2"/><text x="22" y="172" class="label">SRAM · stored code and data</text><rect x="25" y="193" width="320" height="186" class="box"/><text x="43" y="228" class="label">User image</text><text x="43" y="265" class="">.text: getpid + helper</text><text x="43" y="296" class="">.stack: helper arguments</text><text x="43" y="327" class="">and local result</text><rect x="380" y="193" width="310" height="186" class="kernel"/><text x="398" y="228" class="label">Kernel image</text><text x="398" y="265" class="">.text: syscall ISR</text><text x="398" y="296" class="">and handle_syscall</text><text x="398" y="327" class="">.data: process-list state</text><rect x="725" y="193" width="325" height="186" class="kernel"/><text x="743" y="228" class="label">Kernel Heap</text><text x="743" y="265" class="">Current process PCB</text><text x="743" y="296" class="">pid: returned integer</text><text x="743" y="327" class="">Read by current_process()</text><path class="arrow" d="M385 103 L185 133"/><path class="arrow" d="M695 103 L535 133"/><text x="27" y="128" class="small">Fetch user code</text><text x="776" y="128" class="small">Fetch kernel code</text></svg>
