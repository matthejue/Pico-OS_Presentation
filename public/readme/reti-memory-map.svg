<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="188" viewBox="0 46 1440 188" role="img" aria-labelledby="title desc">
  <title id="title">ReTI address space</title>
  <desc id="desc">The two highest bits of a 32-bit word address select EPROM with prefix 00, periphery with prefix 01, or SRAM with prefix 10 or 11. EPROM and periphery each occupy one quarter of the address space, while SRAM occupies one half. Region widths show address ranges, not installed memory capacity.</desc>
  <g font-family="Cantarell, sans-serif" fill="#17313a">
    <!-- Shared boundaries, with region widths in the ratio 1:1:2. -->
    <rect x="60" y="66" width="1320" height="148" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
    <path d="M390 66 V214 M720 66 V214" fill="none" stroke="#637983" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="225" y="116" font-size="34" font-weight="bold">00: EPROM</text>
      <text x="555" y="116" font-size="34" font-weight="bold">01: periphery</text>
      <text x="1050" y="116" font-size="34" font-weight="bold">10 / 11: SRAM</text>
      <g font-family="Cantarell, sans-serif" font-size="23">
        <text x="225" y="169">0x00000000..0x3fffffff</text>
        <text x="555" y="169">0x40000000..0x7fffffff</text>
        <text x="1050" y="169">0x80000000..0xffffffff</text>
      </g>
    </g>
  </g>
</svg>
