<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" role="img"><style>text{font-family:Cantarell, sans-serif;fill:#17313a;font-size:21px} .label{fill:#167b84;font-weight:700;font-size:25px} .small{font-size:18px} .box{fill:#f4fafa;stroke:#078b98;stroke-width:2} .kernel{fill:#fff8e9;stroke:#c8861a;stroke-width:2} .arrow{fill:none;stroke:#078b98;stroke-width:3;marker-end:url(#tip)}</style><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#078b98"/></marker></defs><rect x="5" y="5" width="480" height="147" class="box"/><text x="23" y="40" class="label">1 · User library</text><text x="23" y="77" class="">getpid() → invoke_syscall(8, 0)</text><text x="23" y="108" class="">ACC = 8; IN1 = 0</text><text x="23" y="139" class="">INT 0 enters the kernel</text><rect x="595" y="5" width="480" height="147" class="kernel"/><text x="613" y="40" class="label">2 · Kernel</text><text x="613" y="77" class="">Save caller context; handle_syscall</text><text x="613" y="108" class="">SYSCALL_GETPID →</text><text x="613" y="139" class="">return current_process()-&gt;pid;</text><rect x="595" y="259" width="480" height="147" class="kernel"/><text x="613" y="294" class="label">3 · Interrupt return</text><text x="613" y="331" class="">Preserve PID result in IN2</text><text x="613" y="362" class="">Restore user context; RTI</text><text x="613" y="393" class="">Timer scheduling may occur</text><rect x="5" y="259" width="480" height="147" class="box"/><text x="23" y="294" class="label">4 · User library resumes</text><text x="23" y="331" class="">STOREIN: IN2 → local result</text><text x="23" y="362" class="">invoke_syscall() returns result</text><text x="23" y="393" class="">getpid() returns the PID</text><path class="arrow" d="M485 75 L585 75"/><path class="arrow" d="M835 152 L835 249"/><path class="arrow" d="M595 335 L495 335"/><text x="516" y="58" class="small">INT 0</text><text x="850" y="212" class="small">PID</text><text x="519" y="315" class="small">RTI</text></svg>
