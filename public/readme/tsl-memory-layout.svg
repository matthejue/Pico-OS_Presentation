<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="262" viewBox="0 126 1440 262" role="img" aria-labelledby="title desc">
  <title id="title">TSL DS ACC 2: atomic access to one SRAM word</title>
  <desc id="desc">Four adjacent, equally sized 32-bit SRAM word cells are separated by lines, with omitted memory at both ends. DS is 0x80000040, and offset 2 selects the cell at 0x80000042. TSL DS ACC 2 copies that cell's old value 0 into ACC and changes the same cell to 1 atomically. Neighboring cells remain unchanged.</desc>
  <g font-family="Cantarell, sans-serif" fill="#17313a">

    <!-- One SRAM outline with equal-width word cells, plus omitted memory at both ends. -->
    <rect x="60" y="146" width="1320" height="176" fill="#f4f8f8"/>
    <path d="M720 146 H1005 V322 H720 Z" fill="#fff1d6"/>
    <rect x="60" y="146" width="1320" height="176" fill="none" stroke="#637983" stroke-width="2"/>
    <path d="M150 146 V322 M435 146 V322 M720 146 V322 M1005 146 V322 M1290 146 V322" fill="none" stroke="#637983" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="105" y="222" font-size="32">…</text>
      <text x="1335" y="222" font-size="32">…</text>
      <g font-size="31" font-weight="bold">
        <text x="292.5" y="187">DS + 0 (base)</text>
        <text x="577.5" y="187">DS + 1</text>
        <text x="862.5" y="187">DS + 2 (target)</text>
        <text x="1147.5" y="187">DS + 3</text>
      </g>
      <g font-family="Cantarell, sans-serif" font-size="28">
        <text x="292.5" y="238">0x80000040</text>
        <text x="577.5" y="238">0x80000041</text>
        <text x="862.5" y="238">0x80000042</text>
        <text x="1147.5" y="238">0x80000043</text>
      </g>
      <g font-size="28">
        <text x="292.5" y="290">unchanged</text>
        <text x="577.5" y="290">unchanged</text>
        <text x="862.5" y="293" font-size="40" font-weight="bold" fill="#805916">0 → 1</text>
        <text x="1147.5" y="290">unchanged</text>
      </g>
    </g>
    <text x="60" y="368" font-size="31">1. Copy the old target value into ACC: <tspan font-weight="bold">ACC = 0</tspan></text>
    <text x="750" y="368" font-size="31">2. Set that same SRAM cell to <tspan font-weight="bold">1</tspan>.</text>
  </g>
</svg>
