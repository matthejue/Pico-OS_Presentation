name: Build PicoOS presentation release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build PDF and static presentation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install PDF and browser system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          yarn playwright install-deps chromium

      - name: Install Chromium
        run: yarn playwright install chromium

      - name: Build PDF
        run: make generate-presentation-pdf BROWSER="$(node -e "console.log(require('playwright-chromium').chromium.executablePath())")"

      - name: Build static presentation archive
        run: make package-static-presentation

      - name: Upload presentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: picoos-presentation
          path: |
            picoos-presentation.pdf
            picoos-presentation-static.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release for version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: picoos-presentation
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/picoos-presentation.pdf
            release/picoos-presentation-static.tar.gz
          fail_on_unmatched_files: true
